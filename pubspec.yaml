name: trac_my_cash
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.19.0
  sqflite: ^2.3.0
  path: ^1.9.0
  fl_chart: ^0.68.0

  cupertino_icons: ^1.0.8

  #  NEW PACKAGES
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  #  ASSETS (MAKE SURE FILE EXISTS)
  assets:
    - assets/icon.png

#  SPLASH SCREEN CONFIG
flutter_native_splash:
  color: "#E8F5E9"   
  android: true
  ios: true

#  APP ICON CONFIG
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"